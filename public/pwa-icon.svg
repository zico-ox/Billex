<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="wekndGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8d5e3c"/>
      <stop offset="100%" stop-color="#5a371e"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background rounded squircle with golden rim -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#wekndGrad)" stroke="url(#goldGrad)" stroke-width="12" filter="url(#shadow)"/>

  <!-- Subtle glow ring -->
  <rect x="36" y="36" width="440" height="440" rx="92" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>

  <!-- Stylized Lettermark 'W.' in center -->
  <g fill="#ffffff">
    <path d="M 125 155 L 175 350 L 220 350 L 256 220 L 292 350 L 337 350 L 387 155 L 342 155 L 315 285 L 278 155 L 234 155 L 197 285 L 170 155 Z" />
    <!-- Period dot -->
    <circle cx="410" cy="335" r="18" fill="url(#goldGrad)"/>
  </g>

  <!-- Golden pill badge for "POS" -->
  <rect x="196" y="388" width="120" height="34" rx="17" fill="url(#goldGrad)"/>
  <text x="256" y="411" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="900" fill="#2d170b" text-anchor="middle" letter-spacing="2.5">POS</text>
</svg>
